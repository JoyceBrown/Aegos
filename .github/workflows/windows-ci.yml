name: Windows source checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Windows source checks
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.96.1
          components: rustfmt

      # Only npm's download cache is reused. node_modules, Cargo target output,
      # installers, validation reports, and credentials are never cached.
      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check tracked JavaScript syntax
        run: |
          $files = @(git ls-files -- '*.js')
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Audit npm dependencies
        run: npm audit --json

      - name: Audit architecture
        run: npm run audit:architecture

      - name: Audit control-plane budgets
        run: npm run audit:control-plane

      - name: Audit debt floors
        run: npm run audit:debt

      - name: Reject weakened debt fixtures
        run: node tools/debt-audit.js --self-test

      - name: Audit planning context
        run: npm run audit:planning-context

      - name: Audit license materials
        run: npm run audit:licenses

      - name: Reject bad license fixtures
        run: npm run audit:licenses-fixtures

      - name: Reject bad subscription fixtures
        run: npm run audit:subscription-fixtures

      - name: Reject weakened acceptance fixtures
        run: npm run audit:wr01-acceptance-fixtures

      - name: Reject stale candidate provenance fixtures
        run: npm run audit:candidate-provenance-fixtures
