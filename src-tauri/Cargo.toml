[package]
name = "aegos"
version = "3.6.71"
description = "Aegos lightweight desktop shell"
authors = ["Aegos contributors"]
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-only"
repository = "https://github.com/JoyceBrown/Aegos"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Test-only native WebView2 probe. It is never enabled by the product build.
native-measurement = []

[dependencies]
rand = "0.9"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
base64 = "0.22"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
